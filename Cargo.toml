[workspace]
members = [
    "crates/download-core",
    "crates/download-fs",
    "crates/download-http",
    "crates/download-runtime",
    "crates/download-state",
    "crates/download-store-sqlite",
    "crates/gcdm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
