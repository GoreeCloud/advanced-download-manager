<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="common.css">
  <style>
    body { width: 420px; padding: 14px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
    h1 { font-size:15px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.01em; }
    .input-panel { padding:12px; }
    .input-row { display:grid; grid-template-columns:1fr auto; gap:8px; }
    #start { display:inline-flex; align-items:center; gap:6px; }
    #jobs { margin-top:10px; padding:0 12px; overflow:hidden; }
    .job { display:grid; gap:7px; padding:11px 0; border-top:1px solid var(--border); }
    .job:first-child { border-top:0; }
    .job-top { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .name { font-size:12px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .meta { font-size:11px; }
    .actions { display:flex; gap:6px; flex-wrap:wrap; }
    .actions button { font-size:10px; padding:5px 8px; }
    .summary { display:flex; justify-content:space-between; gap:10px; margin:9px 2px 0; font-size:11px; }
    .empty { display:grid; justify-items:center; gap:5px; padding:16px 10px; text-align:center; }
    .empty img { width:28px; height:28px; opacity:.85; }
    .empty strong { font-size:12px; }
    .empty .muted { font-size:11px; line-height:1.35; }
  </style>
</head>
<body>
  <header>
    <div class="app-title"><img class="icon" src="../icons/app-icon.svg" alt=""><h1>GoreeCloud Download Manager</h1></div>
    <button id="manager" class="icon-button compact" title="Open full manager" aria-label="Open full manager"><svg class="glyph small" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v13H4z"/><path d="M8 9h8M8 13h5"/></svg></button>
  </header>
  <div class="panel input-panel">
    <div class="input-row"><input id="url" type="url" aria-label="Direct download URL" placeholder="Paste a direct HTTP/HTTPS download URL"><button class="primary" id="start"><svg class="glyph small" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m8 11 4 4 4-4"/><path d="M5 19h14"/></svg><span>Start</span></button></div>
    <div class="summary"><span id="summary" class="muted">Loading…</span><span id="speed" class="muted"></span></div>
  </div>
  <div id="popupAnnouncement" class="sr-only" aria-live="polite"></div>
  <div id="jobs" class="panel" aria-label="Recent downloads"></div>
  <script src="popup.js"></script>
</body>
</html>
