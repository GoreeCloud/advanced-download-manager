conformance:
  status: unverified
  validated_at: null
  evidence: []
  blockers:
    - "No executable download engine or platform client is implemented."
    - "No supported platform has build or runtime qualification evidence."
    - "No Platform System integration acceptance evidence exists."
    - "No release or production-acceptance evidence exists."
    - "A recognized software license or approved public rights notice has not yet been selected."
