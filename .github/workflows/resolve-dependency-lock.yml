name: Resolve Dependency Lock

on:
  pull_request:

permissions:
  contents: read

jobs:
  resolve-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Resolve Cargo lockfile
        run: cargo generate-lockfile
      - name: Print resolved lockfile
        shell: python
        run: |
          import base64
          from pathlib import Path

          encoded = base64.b64encode(Path("Cargo.lock").read_bytes()).decode("ascii")
          print("LOCKFILE_BEGIN")
          for index in range(0, len(encoded), 4000):
              print(encoded[index:index + 4000])
          print("LOCKFILE_END")
