name: Windows Lint Repair

on:
  push:
    branches:
      - feature/sqlite-durable-store

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/sqlite-durable-store
          fetch-depth: 0
      - name: Patch Windows decoder lint
        shell: bash
        run: |
          perl -0pi -e 's/#\[cfg\(windows\)\]\nfn decode_path/#\[cfg(windows)\]\n#\[allow(clippy::chunks_exact_to_as_chunks)\]\nfn decode_path/' crates/download-store-sqlite/src/lib.rs
          git diff --exit-code --quiet && exit 1 || true
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/download-store-sqlite/src/lib.rs
          git commit -m 'Fix Windows SQLite path decoder lint'
          git push origin HEAD:feature/sqlite-durable-store
