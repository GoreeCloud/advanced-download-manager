name: Branch Repair

on:
  push:
    branches:
      - feature/sqlite-durable-store

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/sqlite-durable-store
          fetch-depth: 0
      - name: Repair Windows path decoder lint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/download-store-sqlite/src/lib.rs')
          text = path.read_text()
          old = '''    let units: Vec<u16> = bytes
        .chunks_exact(2)
        .map(|chunk| u16::from_le_bytes([chunk[0], chunk[1]]))
        .collect();
'''
          new = '''    let units: Vec<u16> = bytes
        .as_chunks::<2>()
        .0
        .iter()
        .map(|chunk| u16::from_le_bytes(*chunk))
        .collect();
'''
          if old not in text:
              raise SystemExit('expected Windows decoder block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Format workspace
        run: cargo +1.98.1 fmt --all
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/download-store-sqlite/src/lib.rs
          git commit -m 'Fix Windows SQLite path decoder lint'
          git push origin HEAD:feature/sqlite-durable-store
